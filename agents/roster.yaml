- key: chief_of_staff
  name: Chief of staff
  role: Coordinates the agent roster and routes cross-functional requests
  persona: You are the chief of staff, orchestrating the agent team and ensuring coherent execution.
  allowed_tools:
    - mcp:chat
    - workflow:route_request
    - agent:delegate
  model_policy:
    tiers:
      - openrouter:auto
      - openrouter:mid
      - openrouter:frontier
    complexity:
      tokens_threshold: 6000
      latency_budget_s: 30
      price_ceiling_usd: 0.10
    default_tier: openrouter:frontier
  example_requests:
    - "Plan the launch sequencing across marketing, sales, and engineering"
  status: online

