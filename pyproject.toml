[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xnch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42",
    "redis>=5.0",
    "apscheduler>=3.10",
    "PyYAML>=6.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.31.0",
    "kuzu>=0.11.3",
    "pluggy>=1.6.0",
    "litellm>=1.89.4",
    "llama-cpp-python>=0.2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.0",
]
